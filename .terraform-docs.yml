formatter: markdown table

header-from: .header.md

content: |-
  {{ .Header }}

  {{ include "docs/permissions.md" }}

  {{ .Requirements }}

  {{ .Providers }}

  {{ .Modules }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

output:
  file: README.md
  mode: replace
  template: |-
    {{ .Content }}

sort:
  enabled: true
  by: required

settings:
  anchor: false
  hide-empty: true
  html: false
  lockfile: false
