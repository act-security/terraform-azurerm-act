name: Feature request
description: An input, output or capability the module should support.
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed input or output
      render: hcl
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: references
    attributes:
      label: References
