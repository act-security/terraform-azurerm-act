name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  origin:
    name: Pull request source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse pull requests from forks
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::CI does not run on pull requests from forks. A maintainer pushes the change to a branch in $REPO and opens the pull request from there."
            exit 1
          fi

  quality:
    name: Format, lint and docs
    needs: origin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          experimental: true

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Check the generated permissions section and READMEs
        run: make docs-check

      - name: Lint workflows
        run: make workflow-lint

  validate:
    name: Validate (terraform ${{ matrix.label }})
    needs: origin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "1.5.7"
            tool: terraform@1.5.7
          - label: pinned
            tool: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          experimental: true

      - name: Validate every module and example
        env:
          TOOL: ${{ matrix.tool }}
        run: mise exec "$TOOL" -- make validate

  test:
    name: Test (terraform ${{ matrix.label }})
    needs: origin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "1.7.5"
            tool: terraform@1.7.5
          - label: pinned
            tool: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          experimental: true

      - name: Run terraform test with mock providers
        env:
          TOOL: ${{ matrix.tool }}
        run: mise exec "$TOOL" -- make test
